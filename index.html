<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css?v=4">

  <!-- เป็นfont-familyชื่อ"Material Symbols Rounded" จากgoogle โดยจะเป็นพวก สัญลักษณ์ เพื่อเอาไปใช้กับicon ต่างในเว็บ -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- <script src="https://kit.fontawesome.com/f5376a0119.js" crossorigin="anonymous"></script> -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">  
  <!-- <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"> -->
  <script src="https://kit.fontawesome.com/f5376a0119.js" crossorigin="anonymous"></script>
  <title>เสียงบรรยายMuseum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <main class="content is-loading" aria-busy="true">
    <div class="player-status" role="status" aria-live="polite">
      <span class="status-spinner" aria-hidden="true"></span>
      <span class="status-message">กำลังโหลดเสียงบรรยาย...</span>
    </div>
    <!-- ส่วนหัวด้านบน expand_moreคือส่วนหนึ่งของfontgoogle ที่ดึงมาใช้ จะเป็น icon ต่างที่สามารถ -->
    <!-- <div class="top-bar">
      <span class="material-symbols-rounded">expand_more</span>
      <span>Now Playing</span>
      <span class="material-symbols-rounded">m  ore_horiz</span>
    </div> -->
    <!-- แสดงรูป -->
    <div class="image-wrapper">
      <div class="music-image">
        <img src="" alt="ภาพประกอบเสียงบรรยาย" class="rotate">
      </div>
    </div>

    <div class="music-titles">
      <p class="artist"></p>
      <p class="name"></p>
      <!-- <div id="musicList"> -->
        <!-- ข้อมูลจะถูกแสดงที่นี่ -->
      <!-- </div> -->
    </div>
    <!-- แถบหลอดเวลา -->
    <div class="progress-details" role="slider" tabindex="0"
      aria-label="ตำแหน่งการเล่น" aria-valuemin="0" aria-valuemax="100"
      aria-valuenow="0" aria-valuetext="0:00 จาก 0:00">
      <div class="progress-bar">
        <span></span>
      </div>
      <div class="time">
        <span class="current">0:00</span>
        <span class="final"></span>
      </div>
    </div>
    <!-- ควบคุมการเล่น -->
    <div class="control-btn">
      <button type="button" class="player-control material-symbols-rounded" id="prev"
        aria-label="เสียงบรรยายก่อนหน้า">skip_previous</button>
      <button type="button" class="play-pause" aria-label="เล่นเสียงบรรยาย">
        <span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>
      </button>
      <button type="button" class="player-control material-symbols-rounded" id="next"
        aria-label="เสียงบรรยายถัดไป">skip_next</button>
    </div>
    <!-- <div class="volune-datails">
      <div class="volune-bar">
        <span></span>
      </div>
      <span class="material-symbols-outlined" id="v-min">volume_mute</span>
      <span class="material-symbols-outlined" id="v-max">volume_up</span> 
    </div> -->
    <div class="number-buttons">
      <div class="display-number" role="status" aria-live="polite" aria-label="หมายเลขเสียงบรรยายที่เลือก">&nbsp;</div>
        <button type="button" class="number-button" data-number="1">1</button>
        <button type="button" class="number-button" data-number="2">2</button>
        <button type="button" class="number-button" data-number="3">3</button>
        <button type="button" class="number-button" data-number="4">4</button>
        <button type="button" class="number-button" data-number="5">5</button>
        <button type="button" class="number-button" data-number="6">6</button>
        <button type="button" class="number-button" data-number="7">7</button>
        <button type="button" class="number-button" data-number="8">8</button>
        <button type="button" class="number-button" data-number="9">9</button>
        <span></span>
        <button type="button" class="number-button" data-number="0">0</button>
        <!-- <button class="number-button" data-action="delete" style="font-family: Kanit, sans-serif;">ลบ</button> -->
    </div>
  </main>
  <!-- เล่นเพลง -->
  
  <audio src="" class="main-song" preload="metadata"></audio>
  <!-- เพิ่ม jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <!-- ดึงข้อมูล -->
  <script src="js/playlist.js?v=2"></script>
  <script src="js/script.js?v=3"></script>
</body>
</html>
